name: install.sh tests

# Runs install/test-install.sh on Linux (bash 5) and on macOS (the system bash 3.2).
# Manual only, so runs happen on purpose. Start it from the Actions tab ("Run workflow") after
# changing install.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: bash install/test-install.sh
